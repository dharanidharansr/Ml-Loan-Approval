name: Minimal CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Basic tests
      run: |
        # Check Python syntax
        python -c "import py_compile; py_compile.compile('app.py', doraise=True)"
        echo "✅ Python syntax is valid"
        
        # Test basic imports
        python -c "from app import app; print('✅ Flask app imports successfully')"
        
        # Test model loading
        python -c "import pickle; pickle.load(open('model.pkl', 'rb')); print('✅ Model loads successfully')"
    
    - name: Deploy to Render
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
          echo "🚀 Deploying to Render..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Deployment triggered"
        else
          echo "⚠️ RENDER_DEPLOY_HOOK_URL secret not configured"
          echo "💡 Add your Render deploy hook URL to GitHub secrets to enable deployment"
        fi
    
    - name: Results
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "🎉 Pipeline completed successfully!"
          if [ "${{ github.ref }}" == "refs/heads/main" ] && [ "${{ github.event_name }}" == "push" ]; then
            echo "🌐 Your app should be deploying to Render now"
          fi
        else
          echo "❌ Pipeline failed - check the logs above"
        fi
