name: Environment Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v || echo "Tests completed"
    
    - name: Deploy to Staging
      if: github.event.inputs.environment == 'staging'
      run: |
        echo "Deploying to staging environment..."
        curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}"
    
    - name: Deploy to Production
      if: github.event.inputs.environment == 'production'
      run: |
        echo "Deploying to production environment..."
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
    
    - name: Health Check
      run: |
        sleep 60
        if [ "${{ github.event.inputs.environment }}" == "production" ]; then
          curl -f ${{ secrets.APP_URL }} || exit 1
        else
          curl -f ${{ secrets.STAGING_APP_URL }} || exit 1
        fi
    
    - name: Teams Notification
      uses: aliencube/microsoft-teams-actions@v0.8.0
      with:
        webhook_uri: ${{ secrets.TEAMS_WEBHOOK }}
        title: "Deployment to ${{ github.event.inputs.environment }}"
        summary: "Loan Approval App deployed successfully to ${{ github.event.inputs.environment }}!"
        theme_color: "00ff00"
